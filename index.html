<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Mobile PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ContentOS" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="theme-color" content="#007AFF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ContentOS — Multi-Account Creator Workspace untuk manajemen konten media sosial yang modern dan profesional." />
    <title>ContentOS · Creator Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('contentos_appearance');
          if (stored) {
            var config = JSON.parse(stored);
            var root = document.documentElement;
            if (config.theme === 'dark') root.setAttribute('data-theme', 'dark');
            else if (config.theme === 'light') root.setAttribute('data-theme', 'light');
            if (config.density) root.setAttribute('data-density', config.density);
            if (config.font) root.setAttribute('data-font', config.font);
            if (config.sidebar) root.setAttribute('data-sidebar', config.sidebar);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
